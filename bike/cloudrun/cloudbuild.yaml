steps:
  # 建構 Docker image（dir 設為 bike/，context 為 bike/，Dockerfile 在 cloudrun/ 子目錄）
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'bike'
    args:
      - 'build'
      - '-f'
      - 'cloudrun/Dockerfile'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:$COMMIT_SHA'
      - '.'

  # 推送到 Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:$COMMIT_SHA'

  # 部署到 Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=3'

# 預設替換變數（在 Cloud Build trigger 設定頁面可覆蓋）
substitutions:
  _REGION: europe-west1       # 台灣最近的 GCP 區域
  _REPO: cloud-run-source-deploy
  _SERVICE: dtda-week5

options:
  logging: CLOUD_LOGGING_ONLY
